<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>視覺認知訓練</title>
    <style>
        /* 調整顏色變數：黑底方案 */
        :root { 
            --primary: #007AFF; 
            --success: #28a745; 
            --danger: #dc3545; 
            --gaze: #ffeb3b; 
            --empty: #333333; /* 空白格改為深灰色 */
            --bg-color: #000000; /* 全背景黑色 */
            --text-color: #ffffff; 
        }
        
        * { -webkit-touch-callout: none; -webkit-user-select: none; touch-action: none; box-sizing: border-box; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; 
            background: var(--bg-color); 
            color: var(--text-color);
            font-family: -apple-system, sans-serif; 
        }
        
        /* 設定面板 */
        #settings-panel { position: fixed; inset: 0; background: #1a1a1a; z-index: 2000; padding: 30px; overflow-y: auto; color: white; }
        .setting-item { margin-bottom: 25px; border-bottom: 1px solid #444; padding-bottom: 15px; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .btn { padding: 15px 20px; border: 3px solid #555; border-radius: 15px; background: #333; color: white; font-size: 1.1rem; cursor: pointer; transition: 0.2s; }
        .btn.active { border-color: var(--primary); background: var(--primary); font-weight: bold; }
        #start-btn { width: 100%; background: var(--success); color: white; padding: 25px; font-size: 2rem; border-radius: 20px; border: none; margin-top: 20px; font-weight: bold; cursor: pointer; }

        /* 遊戲介面 */
        #ui-header { position: fixed; top: 0; width: 100%; height: 90px; background: #1a1a1a; display: none; justify-content: space-between; align-items: center; padding: 0 30px; z-index: 100; border-bottom: 2px solid #333; }
        #game-area { display: flex; justify-content: center; align-items: center; gap: 80px; width: 100vw; height: 100vh; padding-top: 90px; position: relative; }
        
        /* 強化選項卡片對比 */
        .match-card { 
            position: relative; padding: 20px; 
            background: #ffffff; /* 圖片卡片保持白底，與黑背景形成極高對比 */
            border-radius: 35px; 
            box-shadow: 0 0 30px rgba(255,255,255,0.1); 
            border: 12px solid transparent;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        /* 空白格樣式：深色不顯眼 */
        .match-card.empty-slot { background: var(--empty); border: 12px solid #222; }
        .match-card.empty-slot .placeholder { width: 400px; height: 300px; }

        .match-card img { display: block; border-radius: 18px; width: 400px; height: 300px; object-fit: contain; pointer-events: none; }
        .progress-bar { position: absolute; bottom: -18px; left: 0; width: 0%; height: 18px; background: var(--gaze); border-radius: 9px; box-shadow: 0 0 15px var(--gaze); }

        /* 特效：成功時發光 */
        .match-card.correct-center {
            position: absolute !important; left: 50% !important; top: 55% !important;
            transform: translate(-50%, -50%) scale(1.6) !important;
            border-color: var(--success) !important; 
            box-shadow: 0 0 100px rgba(40, 167, 69, 0.8) !important;
            z-index: 1000 !important;
        }
        .match-card.fade-out { opacity: 0; transform: scale(0.5); pointer-events: none; }
    </style>
</head>
<body>

<div id="settings-panel">
    <h1 style="text-align:center;">🎯 視覺認知訓練</h1>
    
    <div class="setting-item">
        <h3>1. 教學主題</h3>
        <div class="btn-group">
            <button class="btn theme-btn active" data-theme="items">日常用品</button>
            <button class="btn theme-btn" data-theme="fruits">水果</button>
        </div>
    </div>

    <div class="setting-item">
        <h3>2. 訓練難度</h3>
        <div class="btn-group">
            <button class="btn lv-btn active" data-lv="1">Lv 1: 單一目標</button>
            <button class="btn lv-btn" data-lv="2">Lv 2: 二選一 (空白格)</button>
            <button class="btn lv-btn" data-lv="3">Lv 3: 不同類干擾</button>
            <button class="btn lv-btn" data-lv="4">Lv 4: 同類辨識</button>
        </div>
    </div>

    <div class="setting-item">
        <h3>3. 注視時間</h3>
        <div class="btn-group">
            <button class="btn dwell-btn" data-ms="500">0.5s</button>
            <button class="btn dwell-btn active" data-ms="1000">1.0s</button>
            <button class="btn dwell-btn" data-ms="2000">2.0s</button>
        </div>
    </div>
    
    <button id="start-btn" onclick="startGame()">✅ 開始訓練</button>
</div>

<div id="ui-header">
    <button onclick="location.reload()" style="padding:10px 20px; background:#333; color:white; border:1px solid #555; border-radius:10px; cursor:pointer;">🏠 返回</button>
    <div style="font-size: 2.2rem; font-weight: bold;">請找出：<span id="target-name" style="color:var(--gaze);">---</span></div>
    <div style="width:100px;"></div>
</div>

<div id="game-area"></div>

<script>
    const itemsData = [
        { name: '帽子', file: 'cap.png' }, { name: '長褲', file: 'pant.png' },
        { name: '鞋子', file: 'shoes.png' }, { name: '襪子', file: 'sock.png' }, { name: '衣服', file: 'tee.png' }
    ];

    const fruitsData = [
        { name: '蘋果', file: 'apple.png' }, { name: '香蕉', file: 'banana.png' },
        { name: '橙', file: 'orange.png' }, { name: '西瓜', file: 'watermelon.png' }
    ];

    let config = { theme: 'items', lv: 1, dwell: 1000 };
    let timer = null;
    let isTransitioning = false;

    document.querySelectorAll('.theme-btn').forEach(b => b.onclick = () => {
        document.querySelectorAll('.theme-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active'); config.theme = b.dataset.theme;
    });
    document.querySelectorAll('.lv-btn').forEach(b => b.onclick = () => {
        document.querySelectorAll('.lv-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active'); config.lv = parseInt(b.dataset.lv);
    });
    document.querySelectorAll('.dwell-btn').forEach(b => b.onclick = () => {
        document.querySelectorAll('.dwell-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active'); config.dwell = parseInt(b.dataset.ms);
    });

    function speak(text) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-HK';
        window.speechSynthesis.speak(msg);
    }

    function startGame() {
        document.getElementById('settings-panel').style.display = 'none';
        document.getElementById('ui-header').style.display = 'flex';
        nextLevel();
    }

    function nextLevel() {
        isTransitioning = false;
        const area = document.getElementById('game-area');
        area.innerHTML = '';
        
        const currentPool = config.theme === 'items' ? itemsData : fruitsData;
        const otherPool = config.theme === 'items' ? fruitsData : itemsData;
        const target = currentPool[Math.floor(Math.random() * currentPool.length)];
        
        document.getElementById('target-name').innerText = target.name;
        speak("請找出" + target.name);

        let options = [{ data: target, isCorrect: true, type: 'img' }];

        if (config.lv === 2) {
            options.push({ data: null, isCorrect: false, type: 'empty' });
        } else if (config.lv === 3) {
            options.push({ data: otherPool[Math.floor(Math.random() * otherPool.length)], isCorrect: false, type: 'img' });
        } else if (config.lv === 4) {
            const others = currentPool.filter(i => i.name !== target.name);
            options.push({ data: others[Math.floor(Math.random() * others.length)], isCorrect: false, type: 'img' });
        }

        options.sort(() => Math.random() - 0.5).forEach(opt => {
            const card = document.createElement('div');
            card.className = opt.type === 'empty' ? 'match-card empty-slot' : 'match-card';
            
            if (opt.type === 'empty') {
                card.innerHTML = `<div class="placeholder"></div><div class="progress-bar"></div>`;
            } else {
                card.innerHTML = `<img src="${opt.data.file}"><div class="progress-bar"></div>`;
            }
            
            const start = (e) => {
                if (isTransitioning) return;
                e.preventDefault();
                card.style.borderColor = "var(--gaze)";
                const bar = card.querySelector('.progress-bar');
                bar.style.transition = `width ${config.dwell}ms linear`;
                bar.style.width = "100%";
                
                timer = setTimeout(() => {
                    if (opt.isCorrect) {
                        isTransitioning = true;
                        speak("答啱喇");
                        document.querySelectorAll('.match-card').forEach(c => { if (c !== card) c.classList.add('fade-out'); });
                        card.classList.add('correct-center');
                        setTimeout(() => { area.innerHTML = ''; nextLevel(); }, 3000);
                    } else {
                        card.style.borderColor = "var(--danger)";
                        speak(opt.type === 'empty' ? "呢邊係空嘅" : "唔係呢個");
                        setTimeout(() => { if(!isTransitioning) card.style.borderColor = "transparent"; }, 1000);
                    }
                }, config.dwell);
            };

            const stop = () => {
                if (isTransitioning) return;
                clearTimeout(timer);
                card.style.borderColor = "transparent";
                const bar = card.querySelector('.progress-bar');
                bar.style.transition = "none";
                bar.style.width = "0%";
            };

            card.addEventListener('pointerdown', start);
            card.addEventListener('pointerup', stop);
            card.addEventListener('pointerleave', stop);
            area.appendChild(card);
        });
    }
</script>
</body>
</html>
